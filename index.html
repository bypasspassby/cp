<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SC向け TCP/UDP ポート番号クイズ</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:#f8fafc;color:#0f172a;margin:0}
.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0f172a12}
h1{font-size:22px}.hidden{display:none}.muted{color:#64748b;font-size:13px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800}
.primary{background:#2563eb;color:#fff}.secondary{background:#eef2ff;color:#3730a3}.row{display:flex;gap:10px;flex-wrap:wrap}select{padding:8px}
.q{font-size:19px;font-weight:800;margin:14px 0}.choices{display:grid;gap:10px}.choice{text-align:left;background:#fff;border:1.5px solid #cbd5e1;border-radius:14px;padding:14px;font-weight:700}
.correct{background:#f0fdf4;border-color:#86efac}.wrong{background:#fef2f2;border-color:#fecaca}.fb{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc}
.score{font-size:42px;font-weight:900}details{border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin-top:8px}
</style></head><body><div class="wrap"><h1>SC向け TCP/UDP ポート番号クイズ</h1>
<section id="start" class="card"><p class="muted">SC科目A-2で優先して覚えたい代表ポートだけに厳選した38問です。</p>
<div class="row"><label>出題数 <select id="count"><option>10</option><option selected>20</option><option>30</option><option>38</option></select></label>
<label>解説 <select id="mode"><option value="now" selected>回答直後</option><option value="end">最後</option></select></label></div>
<div class="row" style="margin-top:16px"><button id="go" class="btn primary">開始</button><button id="wrongGo" class="btn secondary">前回の誤答だけ</button></div></section>
<section id="quiz" class="card hidden"><div id="meta" class="muted"></div><div id="question" class="q"></div><div id="choices" class="choices"></div>
<div id="fb" class="fb hidden"></div><button id="next" class="btn primary hidden" style="margin-top:14px">次へ</button></section>
<section id="result" class="card hidden"><div id="score" class="score"></div><div id="review"></div><div class="row" style="margin-top:16px">
<button id="retry" class="btn secondary">今回の誤答だけ</button><button id="home" class="btn primary">設定へ</button></div></section>
<script>
const BANK=[{"id": "q1", "question": "TCPのポート番号20に対応する代表的なサービスはどれか。", "choices": ["FTPデータ転送", "SSH", "TFTP", "FTP制御"], "answer": 0, "explanation": "FTPデータ転送は代表的にTCP/20を使用する。"}, {"id": "q2", "question": "TCPのポート番号21に対応する代表的なサービスはどれか。", "choices": ["FTP制御", "Telnet", "SSH", "FTPデータ転送"], "answer": 0, "explanation": "FTP制御は代表的にTCP/21を使用する。"}, {"id": "q3", "question": "TCPのポート番号22に対応する代表的なサービスはどれか。", "choices": ["Telnet", "SSH", "FTP制御", "HTTP"], "answer": 1, "explanation": "SSHは代表的にTCP/22を使用する。"}, {"id": "q4", "question": "TCPのポート番号23に対応する代表的なサービスはどれか。", "choices": ["SSH", "FTP制御", "HTTP", "Telnet"], "answer": 3, "explanation": "Telnetは代表的にTCP/23を使用する。"}, {"id": "q5", "question": "TCPのポート番号25に対応する代表的なサービスはどれか。", "choices": ["POP3", "SMTP", "メールSubmission", "IMAP"], "answer": 1, "explanation": "SMTPは代表的にTCP/25を使用する。"}, {"id": "q6", "question": "TCP/UDPのポート番号53に対応する代表的なサービスはどれか。", "choices": ["NTP", "DHCPサーバ", "DNS", "SNMP"], "answer": 2, "explanation": "DNSは代表的にTCP/UDP/53を使用する。"}, {"id": "q7", "question": "UDPのポート番号67に対応する代表的なサービスはどれか。", "choices": ["DHCPサーバ", "TFTP", "DNS", "DHCPクライアント"], "answer": 0, "explanation": "DHCPサーバは代表的にUDP/67を使用する。"}, {"id": "q8", "question": "UDPのポート番号68に対応する代表的なサービスはどれか。", "choices": ["TFTP", "DHCPクライアント", "DNS", "DHCPサーバ"], "answer": 1, "explanation": "DHCPクライアントは代表的にUDP/68を使用する。"}, {"id": "q9", "question": "UDPのポート番号69に対応する代表的なサービスはどれか。", "choices": ["NTP", "FTPデータ転送", "TFTP", "DNS"], "answer": 2, "explanation": "TFTPは代表的にUDP/69を使用する。"}, {"id": "q10", "question": "TCPのポート番号80に対応する代表的なサービスはどれか。", "choices": ["HTTPS", "HTTP", "SSH", "FTP制御"], "answer": 1, "explanation": "HTTPは代表的にTCP/80を使用する。"}, {"id": "q11", "question": "TCPのポート番号110に対応する代表的なサービスはどれか。", "choices": ["POP3", "IMAP", "メールSubmission", "SMTP"], "answer": 0, "explanation": "POP3は代表的にTCP/110を使用する。"}, {"id": "q12", "question": "UDPのポート番号123に対応する代表的なサービスはどれか。", "choices": ["NTP", "SNMP", "DNS", "RIP"], "answer": 0, "explanation": "NTPは代表的にUDP/123を使用する。"}, {"id": "q13", "question": "TCPのポート番号143に対応する代表的なサービスはどれか。", "choices": ["メールSubmission", "POP3", "SMTP", "IMAP"], "answer": 3, "explanation": "IMAPは代表的にTCP/143を使用する。"}, {"id": "q14", "question": "UDPのポート番号161に対応する代表的なサービスはどれか。", "choices": ["RIP", "SNMP", "NTP", "SNMP Trap"], "answer": 1, "explanation": "SNMPは代表的にUDP/161を使用する。"}, {"id": "q15", "question": "UDPのポート番号162に対応する代表的なサービスはどれか。", "choices": ["SNMP", "RIP", "SNMP Trap", "NTP"], "answer": 2, "explanation": "SNMP Trapは代表的にUDP/162を使用する。"}, {"id": "q16", "question": "TCPのポート番号179に対応する代表的なサービスはどれか。", "choices": ["RIP", "DNS", "BGP", "SNMP"], "answer": 2, "explanation": "BGPは代表的にTCP/179を使用する。"}, {"id": "q17", "question": "TCPのポート番号443に対応する代表的なサービスはどれか。", "choices": ["FTP制御", "SSH", "HTTPS", "HTTP"], "answer": 2, "explanation": "HTTPSは代表的にTCP/443を使用する。"}, {"id": "q18", "question": "UDPのポート番号520に対応する代表的なサービスはどれか。", "choices": ["SNMP", "RIP", "NTP", "BGP"], "answer": 1, "explanation": "RIPは代表的にUDP/520を使用する。"}, {"id": "q19", "question": "TCPのポート番号587に対応する代表的なサービスはどれか。", "choices": ["IMAP", "SMTP", "メールSubmission", "POP3"], "answer": 2, "explanation": "メールSubmissionは代表的にTCP/587を使用する。"}, {"id": "q20", "question": "FTPデータ転送の代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["21/TCP", "20/TCP", "69/UDP", "22/TCP"], "answer": 1, "explanation": "FTPデータ転送は代表的にTCP/20を使用する。"}, {"id": "q21", "question": "FTP制御の代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["23/TCP", "21/TCP", "20/TCP", "22/TCP"], "answer": 1, "explanation": "FTP制御は代表的にTCP/21を使用する。"}, {"id": "q22", "question": "SSHの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["23/TCP", "21/TCP", "22/TCP", "80/TCP"], "answer": 2, "explanation": "SSHは代表的にTCP/22を使用する。"}, {"id": "q23", "question": "Telnetの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["21/TCP", "22/TCP", "80/TCP", "23/TCP"], "answer": 3, "explanation": "Telnetは代表的にTCP/23を使用する。"}, {"id": "q24", "question": "SMTPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["25/TCP", "587/TCP", "143/TCP", "110/TCP"], "answer": 0, "explanation": "SMTPは代表的にTCP/25を使用する。"}, {"id": "q25", "question": "DNSの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["161/UDP", "53/TCP/UDP", "123/UDP", "67/UDP"], "answer": 1, "explanation": "DNSは代表的にTCP/UDP/53を使用する。"}, {"id": "q26", "question": "DHCPサーバの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["69/UDP", "53/TCP/UDP", "68/UDP", "67/UDP"], "answer": 3, "explanation": "DHCPサーバは代表的にUDP/67を使用する。"}, {"id": "q27", "question": "DHCPクライアントの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["69/UDP", "67/UDP", "53/TCP/UDP", "68/UDP"], "answer": 3, "explanation": "DHCPクライアントは代表的にUDP/68を使用する。"}, {"id": "q28", "question": "TFTPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["69/UDP", "123/UDP", "20/TCP", "53/TCP/UDP"], "answer": 0, "explanation": "TFTPは代表的にUDP/69を使用する。"}, {"id": "q29", "question": "HTTPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["80/TCP", "22/TCP", "443/TCP", "21/TCP"], "answer": 0, "explanation": "HTTPは代表的にTCP/80を使用する。"}, {"id": "q30", "question": "POP3の代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["143/TCP", "25/TCP", "587/TCP", "110/TCP"], "answer": 3, "explanation": "POP3は代表的にTCP/110を使用する。"}, {"id": "q31", "question": "NTPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["161/UDP", "520/UDP", "123/UDP", "53/TCP/UDP"], "answer": 2, "explanation": "NTPは代表的にUDP/123を使用する。"}, {"id": "q32", "question": "IMAPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["143/TCP", "587/TCP", "25/TCP", "110/TCP"], "answer": 0, "explanation": "IMAPは代表的にTCP/143を使用する。"}, {"id": "q33", "question": "SNMPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["520/UDP", "161/UDP", "162/UDP", "123/UDP"], "answer": 1, "explanation": "SNMPは代表的にUDP/161を使用する。"}, {"id": "q34", "question": "SNMP Trapの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["162/UDP", "520/UDP", "123/UDP", "161/UDP"], "answer": 0, "explanation": "SNMP Trapは代表的にUDP/162を使用する。"}, {"id": "q35", "question": "BGPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["161/UDP", "53/TCP/UDP", "179/TCP", "520/UDP"], "answer": 2, "explanation": "BGPは代表的にTCP/179を使用する。"}, {"id": "q36", "question": "HTTPSの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["80/TCP", "21/TCP", "22/TCP", "443/TCP"], "answer": 3, "explanation": "HTTPSは代表的にTCP/443を使用する。"}, {"id": "q37", "question": "RIPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["520/UDP", "161/UDP", "123/UDP", "179/TCP"], "answer": 0, "explanation": "RIPは代表的にUDP/520を使用する。"}, {"id": "q38", "question": "メールSubmissionの代表的なポート番号とトランスポートプロトコルの組合せはどれか。", "choices": ["143/TCP", "110/TCP", "25/TCP", "587/TCP"], "answer": 3, "explanation": "メールSubmissionは代表的にTCP/587を使用する。"}],$=s=>document.querySelector(s),L=["ア","イ","ウ","エ"];let S=[],I=0,A=[],NOW=true;
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(x){x.classList.remove("hidden")}function hide(x){x.classList.add("hidden")}
function start(pool){S=sh(pool).slice(0,Math.min(+$("#count").value,pool.length));I=0;A=[];NOW=$("#mode").value==="now";hide($("#start"));hide($("#result"));show($("#quiz"));render()}
$("#go").onclick=()=>start(BANK);$("#wrongGo").onclick=()=>{let ids=JSON.parse(localStorage.getItem("scPortWrong")||"[]"),p=BANK.filter(q=>ids.includes(q.id));if(!p.length)return alert("誤答履歴がありません。");start(p)};
function render(){let q=S[I];$("#meta").textContent=`問題 ${I+1} / ${S.length}`;$("#question").textContent=q.question;$("#choices").innerHTML="";hide($("#fb"));hide($("#next"));
q.choices.forEach((c,j)=>{let b=document.createElement("button");b.className="choice";b.textContent=L[j]+"　"+c;b.onclick=()=>answer(j);$("#choices").appendChild(b)})}
function answer(j){let q=S[I],ok=j===q.answer;A.push({q,j,ok});[...$("#choices").children].forEach((b,k)=>{b.disabled=true;if(NOW){if(k===q.answer)b.classList.add("correct");if(k===j&&!ok)b.classList.add("wrong")}});
if(NOW){$("#fb").textContent=(ok?"正解。 ":"不正解。 ")+q.explanation;show($("#fb"));show($("#next"))}else setTimeout(nxt,100)}
function nxt(){I++;if(I>=S.length)return finish();render()}$("#next").onclick=nxt;
function finish(){hide($("#quiz"));show($("#result"));let ok=A.filter(x=>x.ok).length;$("#score").textContent=`${ok} / ${A.length}（${Math.round(ok/A.length*100)}%）`;$("#review").innerHTML="";
A.forEach((a,n)=>{let d=document.createElement("details");d.open=!a.ok;d.innerHTML=`<summary>問${n+1} ${a.ok?"○":"×"}</summary><p>${a.q.question}</p><p>あなた：${a.q.choices[a.j]}<br>正解：${a.q.choices[a.q.answer]}<br>${a.q.explanation}</p>`;$("#review").appendChild(d)});
let w=A.filter(x=>!x.ok).map(x=>x.q.id);localStorage.setItem("scPortWrong",JSON.stringify(w));$("#retry").disabled=!w.length}
$("#retry").onclick=()=>{let p=A.filter(x=>!x.ok).map(x=>x.q);if(p.length)start(p)};$("#home").onclick=()=>{hide($("#result"));show($("#start"))};
</script></div></body></html>
