<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SC科目A-2 総合クイズ｜HTTP・メール・証明書・ポート番号</title>
<style>
:root {
  --line:#e2e8f0; --blue:#2563eb; --ink:#0f172a; --muted:#64748b;
  --good:#f0fdf4; --bad:#fef2f2;
}
* { box-sizing:border-box; }
body {
  margin:0; background:linear-gradient(#eff6ff,#f8fafc 180px);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
.wrap { max-width:860px; margin:auto; padding:18px 16px 48px; }
.card {
  background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
}
.top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
h1 { font-size:22px; margin:0; }
.pill { background:#dbeafe; color:#1e3a8a; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; }
.hidden { display:none !important; }
.muted { color:var(--muted); font-size:13px; }
.small { font-size:12px; color:var(--muted); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid { display:grid; gap:12px; }
.grid2 { grid-template-columns:1fr 1fr; }
@media (max-width:640px) { .grid2 { grid-template-columns:1fr; } }
.btn { border:0; border-radius:14px; padding:13px 16px; font-weight:800; cursor:pointer; }
.primary { background:var(--blue); color:#fff; }
.secondary { background:#eef2ff; color:#3730a3; }
select { padding:9px; border:1px solid var(--line); border-radius:10px; background:#fff; }
.checkbox-block { border:1px solid var(--line); border-radius:12px; padding:12px; background:#f8fafc; }
.checkbox-item { display:flex; align-items:center; gap:8px; margin:6px 0; font-weight:700; }
.progress { height:9px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin:14px 0; }
.progress div { height:100%; background:#60a5fa; width:0; }
.q { font-size:19px; font-weight:800; margin:14px 0; }
.choices { display:grid; gap:10px; }
.choice {
  text-align:left; background:#fff; border:1.5px solid #cbd5e1; border-radius:14px;
  padding:14px; font-weight:700; display:flex; gap:12px; width:100%;
}
.lab {
  width:30px; height:30px; border-radius:9px; background:#eff6ff; color:#1d4ed8;
  display:grid; place-items:center; flex:0 0 30px;
}
.correct { background:var(--good); border-color:#86efac; }
.wrong { background:var(--bad); border-color:#fecaca; }
.fb { margin-top:14px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#f8fafc; }
.score { font-size:42px; font-weight:900; }
details { border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:8px; }
summary { font-weight:800; cursor:pointer; }

/* 回答選択肢の視認性: PC/iPhone共通 */
.choice {
  font-size: 17px;
  line-height: 1.5;
  min-height: 58px;
  align-items: center;
}
.choice .lab {
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  font-size: 16px;
}
.choice > span:last-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
@media (max-width: 640px) {
  .choice {
    font-size: 16.5px;
    padding: 14px;
    line-height: 1.5;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>SC向け 基礎事項総合クイズ <span style="font-size:13px;color:#64748b">選択肢を毎回シャッフル</span></h1>
    <div class="pill">162問</div>
  </div>

  <section id="start" class="card">
    <p class="muted">SC科目A-2向け。ポート番号、HTTPリクエスト／レスポンスヘッダ、HTTPメソッド・ステータスコード、メール認証、X.509証明書を練習できます。解答位置は毎回ランダムです。</p>

    <div class="checkbox-block">
      <div style="font-weight:800; margin-bottom:6px;">出題範囲</div>
      <label class="checkbox-item"><input type="checkbox" id="cbPort" checked> ポート番号</label>
      <label class="checkbox-item"><input type="checkbox" id="cbHeader" checked> HTTPレスポンスヘッダ</label>
      <label class="checkbox-item"><input type="checkbox" id="cbEmail" checked> 電子メール送信元・配送／SPF・DKIM・DMARC</label>
      <label class="checkbox-item"><input type="checkbox" id="cbCert" checked> X.509証明書・PKI</label>
      <label class="checkbox-item"><input type="checkbox" id="cbHttpMethod" checked> HTTPメソッド・ステータスコード</label>
      <label class="checkbox-item"><input type="checkbox" id="cbHttpRequest" checked> HTTPリクエストヘッダ</label>
      <div class="small">6分野とも初期状態で選択されています。必要な分野をチェックで切り替えられます。</div>
    </div>

    <div class="grid grid2" style="margin-top:14px">
      <label>出題数<br><select id="count">
        <option>10</option><option selected>20</option><option>30</option><option>40</option><option>60</option><option>100</option><option>162</option>
      </select></label>
      <label>解説表示<br><select id="mode">
        <option value="now" selected>回答直後</option><option value="end">最後にまとめて</option>
      </select></label>
    </div>

    <div class="row" style="margin-top:16px">
      <button id="go" class="btn primary">開始</button>
      <button id="wrongGo" class="btn secondary">前回の誤答だけ</button>
    </div>
  </section>

  <section id="quiz" class="card hidden">
    <div id="meta" class="muted"></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="question" class="q"></div>
    <div id="choices" class="choices"></div>
    <div id="fb" class="fb hidden"></div>
    <button id="next" class="btn primary hidden" style="margin-top:14px">次へ</button>
  </section>

  <section id="result" class="card hidden">
    <div id="score" class="score"></div>
    <div id="review"></div>
    <div class="row" style="margin-top:16px">
      <button id="retry" class="btn secondary">今回の誤答だけ</button>
      <button id="home" class="btn primary">設定へ</button>
    </div>
  </section>
</div>

<script>
const BANK = [{"id":"p1","category":"port","question":"TCPのポート番号20に対応する代表的なサービスはどれか。","choices":["FTPデータ転送","SSH","TFTP","FTP制御"],"answer":0,"explanation":"FTPデータ転送は代表的にTCP/20を使用する。"},{"id":"p2","category":"port","question":"TCPのポート番号21に対応する代表的なサービスはどれか。","choices":["FTP制御","Telnet","SSH","FTPデータ転送"],"answer":0,"explanation":"FTP制御は代表的にTCP/21を使用する。"},{"id":"p3","category":"port","question":"TCPのポート番号22に対応する代表的なサービスはどれか。","choices":["Telnet","SSH","FTP制御","HTTP"],"answer":1,"explanation":"SSHは代表的にTCP/22を使用する。"},{"id":"p4","category":"port","question":"TCPのポート番号23に対応する代表的なサービスはどれか。","choices":["SSH","FTP制御","HTTP","Telnet"],"answer":3,"explanation":"Telnetは代表的にTCP/23を使用する。"},{"id":"p5","category":"port","question":"TCPのポート番号25に対応する代表的なサービスはどれか。","choices":["POP3","SMTP","メールSubmission","IMAP"],"answer":1,"explanation":"SMTPは代表的にTCP/25を使用する。"},{"id":"p6","category":"port","question":"TCP/UDPのポート番号53に対応する代表的なサービスはどれか。","choices":["NTP","DHCPサーバ","DNS","SNMP"],"answer":2,"explanation":"DNSは代表的にTCP/UDP/53を使用する。"},{"id":"p7","category":"port","question":"UDPのポート番号67に対応する代表的なサービスはどれか。","choices":["DHCPサーバ","TFTP","DNS","DHCPクライアント"],"answer":0,"explanation":"DHCPサーバは代表的にUDP/67を使用する。"},{"id":"p8","category":"port","question":"UDPのポート番号68に対応する代表的なサービスはどれか。","choices":["TFTP","DHCPクライアント","DNS","DHCPサーバ"],"answer":1,"explanation":"DHCPクライアントは代表的にUDP/68を使用する。"},{"id":"p9","category":"port","question":"UDPのポート番号69に対応する代表的なサービスはどれか。","choices":["NTP","FTPデータ転送","TFTP","DNS"],"answer":2,"explanation":"TFTPは代表的にUDP/69を使用する。"},{"id":"p10","category":"port","question":"TCPのポート番号80に対応する代表的なサービスはどれか。","choices":["HTTPS","HTTP","SSH","FTP制御"],"answer":1,"explanation":"HTTPは代表的にTCP/80を使用する。"},{"id":"p11","category":"port","question":"TCPのポート番号110に対応する代表的なサービスはどれか。","choices":["POP3","IMAP","メールSubmission","SMTP"],"answer":0,"explanation":"POP3は代表的にTCP/110を使用する。"},{"id":"p12","category":"port","question":"UDPのポート番号123に対応する代表的なサービスはどれか。","choices":["NTP","SNMP","DNS","RIP"],"answer":0,"explanation":"NTPは代表的にUDP/123を使用する。"},{"id":"p13","category":"port","question":"TCPのポート番号143に対応する代表的なサービスはどれか。","choices":["メールSubmission","POP3","SMTP","IMAP"],"answer":3,"explanation":"IMAPは代表的にTCP/143を使用する。"},{"id":"p14","category":"port","question":"UDPのポート番号161に対応する代表的なサービスはどれか。","choices":["RIP","SNMP","NTP","SNMP Trap"],"answer":1,"explanation":"SNMPは代表的にUDP/161を使用する。"},{"id":"p15","category":"port","question":"UDPのポート番号162に対応する代表的なサービスはどれか。","choices":["SNMP","RIP","SNMP Trap","NTP"],"answer":2,"explanation":"SNMP Trapは代表的にUDP/162を使用する。"},{"id":"p16","category":"port","question":"TCPのポート番号179に対応する代表的なサービスはどれか。","choices":["RIP","DNS","BGP","SNMP"],"answer":2,"explanation":"BGPは代表的にTCP/179を使用する。"},{"id":"p17","category":"port","question":"TCPのポート番号443に対応する代表的なサービスはどれか。","choices":["FTP制御","SSH","HTTPS","HTTP"],"answer":2,"explanation":"HTTPSは代表的にTCP/443を使用する。"},{"id":"p18","category":"port","question":"UDPのポート番号520に対応する代表的なサービスはどれか。","choices":["SNMP","RIP","NTP","BGP"],"answer":1,"explanation":"RIPは代表的にUDP/520を使用する。"},{"id":"p19","category":"port","question":"TCPのポート番号587に対応する代表的なサービスはどれか。","choices":["IMAP","SMTP","メールSubmission","POP3"],"answer":2,"explanation":"メールSubmissionは代表的にTCP/587を使用する。"},{"id":"p20","category":"port","question":"FTPデータ転送の代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["21/TCP","20/TCP","69/UDP","22/TCP"],"answer":1,"explanation":"FTPデータ転送は代表的にTCP/20を使用する。"},{"id":"p21","category":"port","question":"FTP制御の代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["23/TCP","21/TCP","20/TCP","22/TCP"],"answer":1,"explanation":"FTP制御は代表的にTCP/21を使用する。"},{"id":"p22","category":"port","question":"SSHの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["23/TCP","21/TCP","22/TCP","80/TCP"],"answer":2,"explanation":"SSHは代表的にTCP/22を使用する。"},{"id":"p23","category":"port","question":"Telnetの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["21/TCP","22/TCP","80/TCP","23/TCP"],"answer":3,"explanation":"Telnetは代表的にTCP/23を使用する。"},{"id":"p24","category":"port","question":"SMTPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["25/TCP","587/TCP","143/TCP","110/TCP"],"answer":0,"explanation":"SMTPは代表的にTCP/25を使用する。"},{"id":"p25","category":"port","question":"DNSの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["161/UDP","53/TCP/UDP","123/UDP","67/UDP"],"answer":1,"explanation":"DNSは代表的にTCP/UDP/53を使用する。"},{"id":"p26","category":"port","question":"DHCPサーバの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["69/UDP","53/TCP/UDP","68/UDP","67/UDP"],"answer":3,"explanation":"DHCPサーバは代表的にUDP/67を使用する。"},{"id":"p27","category":"port","question":"DHCPクライアントの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["69/UDP","67/UDP","53/TCP/UDP","68/UDP"],"answer":3,"explanation":"DHCPクライアントは代表的にUDP/68を使用する。"},{"id":"p28","category":"port","question":"TFTPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["69/UDP","123/UDP","20/TCP","53/TCP/UDP"],"answer":0,"explanation":"TFTPは代表的にUDP/69を使用する。"},{"id":"p29","category":"port","question":"HTTPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["80/TCP","22/TCP","443/TCP","21/TCP"],"answer":0,"explanation":"HTTPは代表的にTCP/80を使用する。"},{"id":"p30","category":"port","question":"POP3の代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["143/TCP","25/TCP","587/TCP","110/TCP"],"answer":3,"explanation":"POP3は代表的にTCP/110を使用する。"},{"id":"p31","category":"port","question":"NTPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["161/UDP","520/UDP","123/UDP","53/TCP/UDP"],"answer":2,"explanation":"NTPは代表的にUDP/123を使用する。"},{"id":"p32","category":"port","question":"IMAPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["143/TCP","587/TCP","25/TCP","110/TCP"],"answer":0,"explanation":"IMAPは代表的にTCP/143を使用する。"},{"id":"p33","category":"port","question":"SNMPの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["520/UDP","161/UDP","162/UDP","123/UDP"],"answer":1,"explanation":"SNMPは代表的にUDP/161を使用する。"},{"id":"p34","category":"port","question":"SNMP Trapの代表的なポート番号とトランスポートプロトコルの組合せはどれか。","choices":["162/UDP","520/UDP","123/UDP","161/UDP"],"answer":0,"explanation":"SNMP Trapは代表的にUDP/162を使用する。"},{"id":"p35","catego sage","subjectAltName"],"answer":0,"explanation":"Basic Constraints はCA証明書かどうかなどを示す。"},{"id":"x10","category":"cert","question":"証明書失効リスト（CRL）の取得先を示す拡張はどれか。","choices":["CRL Distribution Points","Authority Information Access","Extended Key Usage","Subject Public Key Info"],"answer":0,"explanation":"CRL Distribution Points はCRLの取得先を示す。"},{"id":"x11","category":"cert","question":"OCSPレスポンダやCA発行者証明書の取得先を示す拡張はどれか。","choices":["Authority Information Access","CRL Distribution Points","Basic Constraints","Subject Alternative Name"],"answer":0,"explanation":"Authority Information Access（AIA）はOCSPレスポンダやCA発行者証明書の取得先などを示す。"},{"id":"x12","category":"cert","question":"CAが証明書の内容に対して生成したデジタル署名そのものはどれか。","choices":["Signature Value","Signature Algorithm","Subject Public Key Info","Serial Number"],"answer":0,"explanation":"Signature Value はCAが秘密鍵を使って生成した証明書へのデジタル署名である。"},{"id":"x13","category":"cert","question":"CAが証明書への署名に使用したアルゴリズムを示す項目はどれか。","choices":["Signature Algorithm","Signature Value","Subject Public Key Info","Extended Key Usage"],"answer":0,"explanation":"Signature Algorithm はCAが証明書への署名に用いたアルゴリズムを示す。"},{"id":"x14","category":"cert","question":"TLS接続先のホスト名とサーバ証明書を照合するとき、現在重視されるフィールドはどれか。","choices":["subjectAltName","Serial Number","Key Usage","Issuer"],"answer":0,"explanation":"ホスト名検証では subjectAltName の dNSName などと接続先ホスト名を照合する。"},{"id":"x15","category":"cert","question":"サーバ証明書の subjectAltName に dNSName がある場合、照合対象として適切なものはどれか。","choices":["接続先のFQDN","CAの識別名","証明書の番号","OCSPのURL"],"answer":0,"explanation":"dNSName は接続先のFQDNと照合してサーバ名の一致を確認するために使われる。"},{"id":"x16","category":"cert","question":"サーバ証明書を検証する際、有効期限の確認に使う組合せはどれか。","choices":["Not Before / Not After","Issuer / Subject","serverAuth / clientAuth","CA:TRUE / CA:FALSE"],"answer":0,"explanation":"Validity の Not Before と Not After により有効期間内かを確認する。"},{"id":"x17","category":"cert","question":"証明書チェーンで、下位証明書を発行した主体を確認する際に参照する項目はどれか。","choices":["Issuer","Subject","Key Usage","Validity"],"answer":0,"explanation":"Issuer は証明書を発行したCAを示し、証明書チェーンの確認で重要となる。"},{"id":"x18","category":"cert","question":"証明書に含まれる公開鍵が改ざんされていないことを確認する際、CA署名の検証に使う鍵はどれか。","choices":["CAの公開鍵","CAの秘密鍵","サーバの秘密鍵","クライアントの秘密鍵"],"answer":0,"explanation":"証明書へのCA署名は対応するCAの公開鍵で検証する。"},{"id":"x19","category":"cert","question":"TLSサーバ認証向け証明書のExtended Key Usageで代表的な値はどれか。","choices":["serverAuth","clientAuth","codeSigning","emailProtection"],"answer":0,"explanation":"TLSサーバ認証では Server Authentication（serverAuth）が代表的である。"},{"id":"x20","category":"cert","question":"TLSクライアント認証向け証明書のExtended Key Usageで代表的な値はどれか。","choices":["clientAuth","serverAuth","codeSigning","timeStamping"],"answer":0,"explanation":"TLSクライアント認証では Client Authentication（clientAuth）が代表的である。"},{"id":"x21","category":"cert","question":"TLSクライアント認証でKey Usageに含まれる代表的な用途はどれか。","choices":["Digital Signature","Certificate Sign","CRL Sign","Data Encipherment"],"answer":0,"explanation":"TLSクライアント認証では秘密鍵で署名するため Digital Signature が代表的である。"},{"id":"x22","category":"cert","question":"一般的なサーバ証明書やクライアント証明書のBasic Constraintsとして適切なものはどれか。","choices":["CA:FALSE","CA:TRUE","pathLen:0","pathLen:1"],"answer":0,"explanation":"通常のサーバ証明書やクライアント証明書はCA証明書ではないため CA:FALSE となる。"},{"id":"x23","category":"cert","question":"CRLで失効した証明書を識別するために用いられる証明書内の項目はどれか。","choices":["Serial Number","Subject","Issuer","Version"],"answer":0,"explanation":"CRLには失効した証明書のシリアル番号が記録され、対象証明書を識別する。"},{"id":"x24","category":"cert","question":"証明書の失効状態をオンラインで問い合わせる仕組みはどれか。","choices":["OCSP","CRL","CSR","SCEP"],"answer":0,"explanation":"OCSPは特定の証明書の失効状態をオンラインで問い合わせる仕組みである。"},{"id":"x25","category":"cert","question":"証明書に記載されたOCSPレスポンダの取得先を確認する際に参照する拡張はどれか。","choices":["Authority Information Access","CRL Distribution Points","Extended Key Usage","Basic Constraints"],"answer":0,"explanation":"AIAにはOCSPレスポンダのURLなどを記載できる。"},{"id":"x26","category":"cert","question":"証明書に記載されたCRL取得先を確認する際に参照する拡張はどれか。","choices":["CRL Distribution Points","Authority Information Access","Key Usage","subjectAltName"],"answer":0,"explanati めに使う。"},{"id":"http214_8","category":"method_status","question":"HTTPのCONNECTメソッドの説明として最も適切なものはどれか。","choices":["URIの情報を取得する","プロキシのトンネルを作る","データの処理を依頼する","本文なしでヘッダを得る"],"answer":1,"explanation":"CONNECTはプロキシを介したトンネル接続を確立するために用いる。"},{"id":"http214_9","category":"method_status","question":"HTTPレスポンスのステータスコード100の意味として最も適切なものはどれか。","choices":["要求された資源の不在を示す","要求処理の成功を示す","要求の継続を案内する","対象資源が未更新と示す"],"answer":2,"explanation":"100 Continueは暫定応答であり、クライアントに要求の継続を促す。"},{"id":"http214_10","category":"method_status","question":"HTTPレスポンスのステータスコード200の意味として最も適切なものはどれか。","choices":["対象資源が未更新と示す","要求処理の成功を示す","サーバ内部の障害を示す","HTTP認証の必要を示す"],"answer":1,"explanation":"200 OKはHTTPリクエストが成功したことを表す。"},{"id":"http214_11","category":"method_status","question":"HTTPレスポンスのステータスコード304の意味として最も適切なものはどれか。","choices":["要求の継続を案内する","要求された資源の不在を示す","対象資源が未更新と示す","HTTP認証の必要を示す"],"answer":2,"explanation":"304 Not Modifiedは条件付き要求の検証で更新がないことを表す。"},{"id":"http214_12","category":"method_status","question":"HTTPレスポンスのステータスコード401の意味として最も適切なものはどれか。","choices":["要求処理の成功を示す","HTTP認証の必要を示す","要求された資源の不在を示す","サーバ内部の障害を示す"],"answer":1,"explanation":"401 UnauthorizedはHTTP認証が必要であることなどを表す。"},{"id":"http214_13","category":"method_status","question":"HTTPレスポンスのステータスコード404の意味として最も適切なものはどれか。","choices":["サーバ内部の障害を示す","要求の継続を案内する","対象資源が未更新と示す","要求された資源の不在を示す"],"answer":3,"explanation":"404 Not Foundは要求した対象資源が見つからないことを表す。"},{"id":"http214_14","category":"method_status","question":"HTTPレスポンスのステータスコード500の意味として最も適切なものはどれか。","choices":["要求の継続を案内する","要求処理の成功を示す","サーバ内部の障害を示す","HTTP認証の必要を示す"],"answer":2,"explanation":"500 Internal Server Errorはサーバ内部の処理エラーを表す。"},{"id":"http214_15","category":"method_status","question":"条件付きGETに対し、キャッシュ済みの内容が更新されていないことを通知するHTTPステータスコードはどれか。","choices":["404","301","304","200"],"answer":2,"explanation":"304 Not Modifiedは条件付きGETなどに対する未更新の応答である。"},{"id":"http214_16","category":"method_status","question":"HTTP認証情報の提示を要求するレスポンスに適するステータスコードはどれか。","choices":["404","401","400","403"],"answer":1,"explanation":"401 UnauthorizedはHTTP認証が必要な状態を示し、WWW-Authenticateとともに使われる。"},{"id":"http214_17","category":"method_status","question":"要求されたURLの資源が見つからないことを示すステータスコードはどれか。","choices":["404","401","400","403"],"answer":0,"explanation":"404 Not Foundは要求された資源が見つからない状態を示す。"},{"id":"http214_18","category":"method_status","question":"サーバ内の想定外の処理障害を通知するHTTPステータスコードはどれか。","choices":["500","404","503","400"],"answer":0,"explanation":"500 Internal Server Errorはサーバ内部の一般的なエラーを表す。"},{"id":"http214_19","category":"request_header","question":"HTTPリクエストで「接続先のホスト名とポート番号を通知する」ときに使う代表的なヘッダはどれか。","choices":["Host","Origin","Referer","User-Agent"],"answer":0,"explanation":"Hostはリクエスト先ホスト名と、必要に応じてポート番号を伝える。"},{"id":"http214_20","category":"request_header","question":"HTTPリクエストで「受信可能なメディアタイプを通知する」ときに使う代表的なヘッダはどれか。","choices":["Content-Type","Accept","Accept-Encoding","Accept-Language"],"answer":1,"explanation":"Acceptには受け入れ可能なメディアタイプを記載する。"},{"id":"http214_21","category":"request_header","question":"HTTPリクエストで「HTTP認証用の資格情報を通知する」ときに使う代表的なヘッダはどれか。","choices":["Authorization","Authentication-Info","Proxy-Authenticate","WWW-Authenticate"],"answer":0,"explanation":"AuthorizationはHTTP認証でクライアントが資格情報を提示する際に用いる。"},{"id":"http214_22","category":"request_header","question":"HTTPリクエストで「参照元のURIを通知する」ときに使う代表的なヘッダはどれか。","choices":["Origin","Referer","Host","Referrer-Policy"],"answer":1,"explanation":"Refererは直前の参照元ページのURIなどを送信する。綴りはRefererである。"},{"id":"http214_23","category":"request_header","question":"HTTPリクエストで「保存済みCookieをサーバへ送信する」ときに使う代表的なヘッダはどれか。","choices":["Authorization","Set-Cookie","Cookie","User-Agent"],"answer":2,"explanation":"Cookieは、ブラウザが保持しているCookieをリクエストに載せて送る。"},{"id":"http214_24","category":"request_header","question":"HTTPリクエストで「クライアントソフトの情報を通知する」ときに使う代表的なヘッダはどれか。","choices":["Accept","Host","User-Agent","Server"],"answer":2,"explanation":"User-Agentはブラウザなどのクライアントソフトウェアの情報を伝える。"},{"id":"http214_25","category":"request_header","question":"HTTPリクエストヘッダ「Host」の主な役割はどれか。","choices":["接続先ホストを指定する","HTTP認証情報を提示する","応答で受け取る形式を示す","参照元のURIを伝える"],"answer":0,"explanation":"Hostはリクエスト先のホスト名とポート番号を示す。"},{"id":"http214_26","category":"request_header","question":"HTTPリクエストヘッダ「Accept」の主な役割はどれか。","choices":["応答で受け取る形式を示す","参照元のURIを伝える","HTTP認証情報を提示する","保存済みCookieを送る"],"answer":0,"explanation":"Acceptはクライアントが受け入れ可能なメディアタイプを示す。"},{"id":"http214_27","category":"request_header","question":"HTTPリクエストヘッダ「Authorization」の主な役割はどれか。","choices":["参照元のURIを伝える","保存済みCookieを送る","ブラウザの識別情報を送る","HTTP認証情報を提示する"],"answer":3,"explanation":"AuthorizationはHTTP認証情報をサーバへ提示する。"},{"id":"http214_28","category":"request_header","question":"HTTPリクエストヘッダ「Referer」の主な役割はどれか。","choices":["接続先ホストを指定する","ブラウザの識別情報を送る","保存済みCookieを送る","参照元のURIを伝える"],"answer":3,"explanation":"Refererはリンク元などのURI情報をサーバへ伝える。"},{"id":"http214_29","category":"request_header","question":"HTTPリクエストヘッダ「Cookie」の主な役割はどれか。","choices":["接続先ホストを指定する","応答で受け取る形式を示す","ブラウザの識別情報を送る","保存済みCookieを送る"],"answer":3,"explanation":"Cookieはクライアントから保存済みCookieをサーバへ送る。"},{"id":"http214_30","category":"request_header","question":"HTTPリクエストヘッダ「User-Agent」の主な役割はどれか。","choices":["HTTP認証情報を提示する","ブラウザの識別情報を送る","接続先ホストを指定する","応答で受け取る形式を示す"],"answer":1,"explanation":"User-Agentはブラウザなどのクライアント情報を示す。"},{"id":"http214_31","category":"request_header","question":"HTTPリクエストで「Accept: application/json」が指定された場合、何を伝えているか。","choices":["保存済みCookieの値","受入可能な応答の形式","送信本文のデータ形式","利用可能な認証方式"],"answer":1,"explanation":"Acceptはクライアントが受け入れ可能なメディアタイプを示す。Content-Typeはメッセージ本文の形式を示す。"},{"id":"http214_32","category":"request_header","question":"ログに「Cookie: SID=abc123」と記録されていた。Cookieを送った主体はどれか。","choices":["HTTPサーバ","認証局（CA）","HTTPプロキシ","HTTPクライアント"],"answer":3,"explanation":"CookieはHTTPクライアントからサーバへ送るヘッダである。サーバが設定する場合はSet-Cookieを使う。"},{"id":"http214_33","category":"header","question":"旧来のブラウザで、ページ内のフレーム表示によるクリックジャッキング対策に利用されるレスポンスヘッダはどれか。","choices":["X-Frame-Options","X-Content-Type-Options","X-XSS-Protection","Referrer-Policy"],"answer":0,"explanation":"X-Frame-OptionsはDENYやSAMEORIGINでフレーム内表示を制御する。CSPのframe-ancestorsも関連する。"},{"id":"http214_34","category":"header","question":"「X-Frame-Options: DENY」の効果として最も適切なものはどれか。","choices":["MIMEタイプの自動推測を抑止","ページのフレーム内表示を拒否","HTTPからHTTPSへの移行を促す","HTTPのキャッシュ保存を拒否"],"answer":1,"explanation":"DENYはフレーム内への表示を拒否する。クリックジャッキング対策として利用される。"},{"id":"http214_35","category":"header","question":"旧来のブラウザのXSSフィルター動作を制御するためのレスポンスヘッダはどれか。","choices":["Content-Security-Policy","X-Content-Type-Options","X-Frame-Options","X-XSS-Protection"],"answer":3,"explanation":"X-XSS-Protectionは旧来のブラウザ向けの機能。現代のブラウザでは非推奨・未対応の場合があり、XSS対策には適切なエスケープやCSPなどが重要。"},{"id":"http214_36","category":"header","question":"X-XSS-Protectionについて、現在のWebアプリケーションでの扱いとして最も適切なものはどれか。","choices":["TLSの暗号方式を設定する","HTTP認証方式を指定する","DNSの名前解決方式を指定する","旧来のフィルター用で非推奨"],"answer":3,"explanation":"X-XSS-Protectionは古いブラウザのXSSフィルター機能を制御したもので、現行の対策ではCSPなどが優先される。"}];
const $ = s => document.querySelector(s);
const LABELS = ["ア","イ","ウ","エ"];
const fallbackStore = new Map();
function getSaved(key) {
  try { return localStorage.getItem(key) || fallbackStore.get(key) || null; }
  catch (e) { return fallbackStore.get(key) || null; }
}
function saveValue(key, value) {
  fallbackStore.set(key, value);
  try { localStorage.setItem(key, value); } catch (e) { /* no persistent storage in restricted previews */ }
}
let SESSION = [];
let INDEX = 0;
let ANSWERS = [];
let NOW = true;

function shuffle(arr) {
  let a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function shuffleQuestion(q) {
  const order = shuffle([0, 1, 2, 3]);
  const shuffledChoices = order.map(i => q.choices[i]);
  const shuffledAnswer = order.indexOf(q.answer);
  return Object.assign({}, q, {
    choices: shuffledChoices,
    answer: shuffledAnswer
  });
}
function show(el) { el.classList.remove("hidden"); }
function hide(el) { el.classList.add("hidden"); }

function selectedCategories() {
  const cats = [];
  if ($("#cbPort").checked) cats.push("port");
  if ($("#cbHeader").checked) cats.push("header");
  if ($("#cbEmail").checked) cats.push("email");
  if ($("#cbCert").checked) cats.push("cert");
  if ($("#cbHttpMethod").checked) cats.push("method_status");
  if ($("#cbHttpRequest").checked) cats.push("request_header");
  return cats;
}
function filteredBank() {
  const cats = selectedCategories();
  return BANK.filter(q => cats.includes(q.category));
}
function begin(pool) {
  if (!pool.length) {
    alert("少なくとも1つの出題範囲を選択してください。");
    return;
  }
  SESSION = shuffle(pool).slice(0, Math.min(Number($("#count").value), pool.length)).map(shuffleQuestion);
  INDEX = 0;
  ANSWERS = [];
  NOW = $("#mode").value === "now";
  hide($("#start"));
  hide($("#result"));
  show($("#quiz"));
  render();
}
$("#go").onclick = () => begin(filteredBank());
$("#wrongGo").onclick = () => {
  const ids = JSON.parse(getSaved("scMixedWrong") || "[]");
  const cats = selectedCategories();
  const pool = BANK.filter(q => ids.includes(q.id) && cats.includes(q.category));
  if (!pool.length) {
    alert("選択中の範囲に、前回の誤答履歴がありません。");
    return;
  }
  begin(pool);
};

function render() {
  const q = SESSION[INDEX];
  $("#meta").textContent = "問題 " + (INDEX + 1) + " / " + SESSION.length;
  $("#bar").style.width = ((INDEX / SESSION.length) * 100) + "%";
  $("#question").textContent = q.question;
  $("#choices").innerHTML = "";
  hide($("#fb"));
  hide($("#next"));
  q.choices.forEach((c, j) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="lab">' + LABELS[j] + '</span><span>' + c + '</span>';
    b.onclick = () => answer(j);
    $("#choices").appendChild(b);
  });
}

function answer(j) {
  const q = SESSION[INDEX];
  const ok = j === q.answer;
  ANSWERS.push({q:q, j:j, ok:ok});
  Array.from($("#choices").children).forEach((b, k) => {
    b.disabled = true;
    if (NOW) {
      if (k === q.answer) b.classList.add("correct");
      if (k === j && !ok) b.classList.add("wrong");
    }
  });
  if (NOW) {
    $("#fb").textContent = (ok ? "正解。 " : "不正解。 ") + q.explanation;
    show($("#fb"));
    show($("#next"));
  } else {
    setTimeout(nextQuestion, 120);
  }
}
function nextQuestion() {
  INDEX += 1;
  if (INDEX >= SESSION.length) {
    finish();
    return;
  }
  render();
}
$("#next").onclick = nextQuestion;

function finish() {
  hide($("#quiz"));
  show($("#result"));
  const ok = ANSWERS.filter(x => x.ok).length;
  $("#score").textContent = ok + " / " + ANSWERS.length + "（" + Math.round(ok / ANSWERS.length * 100) + "%）";
  $("#review").innerHTML = "";
  ANSWERS.forEach((a, n) => {
    const d = document.createElement("details");
    d.open = !a.ok;
    d.innerHTML =
      "<summary>問" + (n + 1) + " " + (a.ok ? "○" : "×") + "</summary>" +
      "<p><b>問題：</b> " + a.q.question + "</p>" +
      "<p><b>あなた：</b> " + a.q.choices[a.j] + "<br>" +
      "<b>正解：</b> " + a.q.choices[a.q.answer] + "<br>" +
      "<b>解説：</b> " + a.q.explanation + "</p>";
    $("#review").appendChild(d);
  });
  const wrongIds = ANSWERS.filter(x => !x.ok).map(x => x.q.id);
  saveValue("scMixedWrong", JSON.stringify(wrongIds));
  $("#retry").disabled = wrongIds.length === 0;
}
$("#retry").onclick = () => {
  const pool = ANSWERS.filter(x => !x.ok).map(x => x.q);
  if (pool.length) begin(pool);
};
$("#home").onclick = () => {
  hide($("#result"));
  show($("#start"));
};
</script>
</body>
</html>
