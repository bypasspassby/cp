<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SC 科目A-2 クイズ</title>
<meta name="theme-color" content="#0f172a">
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --accent:#2563eb; --accent2:#1d4ed8;
    --good:#15803d; --bad:#b91c1c; --warn:#a16207;
    --shadow:0 10px 30px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:linear-gradient(180deg,#eff6ff 0,#f8fafc 180px);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",
      "Yu Gothic","Meiryo",sans-serif;line-height:1.55;
  }
  button,input,select,textarea{font:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 48px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.01em}
  .pill{font-size:12px;background:#dbeafe;color:#1e3a8a;padding:6px 10px;border-radius:999px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .hidden{display:none!important}
  .grid{display:grid;gap:12px}
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .section-title{font-size:15px;font-weight:800;margin:0 0 8px}
  .muted{color:var(--muted);font-size:13px}
  .btn{
    border:none;border-radius:14px;padding:13px 16px;font-weight:800;cursor:pointer;
    transition:.14s transform,.14s background,.14s box-shadow;
  }
  .btn:active{transform:scale(.985)}
  .primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.23)}
  .primary:hover{background:var(--accent2)}
  .secondary{background:#eef2ff;color:#3730a3}
  .ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .danger{background:#fef2f2;color:#991b1b}
  .settings{display:grid;gap:16px}
  .setting-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  select,input[type="number"]{
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink)
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid var(--line);padding:7px 9px;border-radius:999px;font-size:13px}
  .quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
  .progress{height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:16px}
  .progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);width:0%}
  .qmeta{font-size:12px;color:var(--muted);font-weight:700}
  .question{font-size:19px;font-weight:800;margin:6px 0 14px;white-space:pre-wrap}
  .choices{display:grid;gap:10px}
  .choice{
    width:100%;text-align:left;background:#fff;border:1.5px solid #cbd5e1;border-radius:14px;padding:14px 14px;
    display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-weight:650;
  }
  .choice:hover{border-color:#93c5fd;background:#f8fbff}
  .choice:disabled{cursor:default}
  .label{
    flex:0 0 30px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:#eff6ff;color:#1d4ed8;font-weight:900
  }
  .choice.correct{border-color:#86efac;background:#f0fdf4}
  .choice.correct .label{background:#dcfce7;color:#166534}
  .choice.wrong{border-color:#fecaca;background:#fef2f2}
  .choice.wrong .label{background:#fee2e2;color:#991b1b}
  .feedback{margin-top:14px;padding:13px 14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
  .feedback.good{background:#f0fdf4;border-color:#bbf7d0}
  .feedback.bad{background:#fef2f2;border-color:#fecaca}
  .feedback-title{font-weight:900;margin-bottom:4px}
  .nextrow{margin-top:14px;display:flex;justify-content:flex-end}
  .score{font-size:44px;font-weight:900;letter-spacing:-.03em}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
  .kpi{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .kpi b{display:block;font-size:22px}
  @media(max-width:560px){.kpis{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left;vertical-align:top}
  th{color:#475569;background:#f8fafc}
  details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
  summary{cursor:pointer;font-weight:800}
  .review-item{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .small{font-size:12px}
  textarea{
    width:100%;min-height:170px;border:1px solid var(--line);border-radius:12px;padding:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px
  }
  .footer{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>SC 科目A-2 クイズ</h1>
    <div class="pill">タップ回答・オフライン対応</div>
  </div>

  <section id="start" class="card">
    <div class="settings">
      <div>
        <div class="section-title">出題設定</div>
        <div class="muted">問題バンクからランダムに出題します。回答は選択肢をタップするだけです。</div>
      </div>

      <div class="grid grid2">
        <label class="setting-row">
          <span><b>出題数</b><br><span class="muted">最大 <span id="bankCount"></span> 問</span></span>
          <select id="count">
            <option value="10">10問</option>
            <option value="20" selected>20問</option>
            <option value="30">30問</option>
            <option value="50">50問</option>
            <option value="100">100問</option>
          </select>
        </label>

        <label class="setting-row">
          <span><b>解説表示</b><br><span class="muted">回答直後か、最後にまとめて表示</span></span>
          <select id="mode">
            <option value="immediate" selected>回答直後</option>
            <option value="end">最後にまとめて</option>
          </select>
        </label>
      </div>

      <div>
        <div class="section-title">出題分野</div>
        <div id="categoryChips" class="chips"></div>
      </div>

      <div class="grid grid2">
        <button id="startBtn" class="btn primary">クイズ開始</button>
        <button id="wrongBtn" class="btn secondary">前回の誤答だけ復習</button>
      </div>

      <details>
        <summary>追加問題をJSONで読み込む</summary>
        <p class="muted">今後ChatGPTが生成した問題を、この形式で追加できます。読み込んだ問題はこの端末のブラウザに保存されます。</p>
        <textarea id="importBox" placeholder='[{"category":"ネットワーク","question":"問題文","choices":["選択肢1","選択肢2","選択肢3","選択肢4"],"answer":1,"explanation":"解説"}]'></textarea>
        <div class="grid grid2" style="margin-top:10px">
          <button id="importBtn" class="btn ghost">JSONを追加</button>
          <button id="clearCustomBtn" class="btn danger">追加問題を削除</button>
        </div>
        <div id="importMsg" class="muted" style="margin-top:8px"></div>
      </details>
    </div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="quiz-head">
      <div>
        <div id="qno" class="qmeta"></div>
        <div id="cat" class="qmeta"></div>
      </div>
      <button id="quitBtn" class="btn ghost small">中断</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div id="question" class="question"></div>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="nextrow">
      <button id="nextBtn" class="btn primary hidden">次の問題</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <div class="section-title">結果</div>
    <div id="score" class="score"></div>
    <div class="kpis">
      <div class="kpi"><span class="muted">正解</span><b id="correctKpi"></b></div>
      <div class="kpi"><span class="muted">正答率</span><b id="rateKpi"></b></div>
      <div class="kpi"><span class="muted">誤答</span><b id="wrongKpi"></b></div>
    </div>

    <div class="section-title">分野別</div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>分野</th><th>正解</th><th>出題</th><th>正答率</th></tr></thead>
        <tbody id="catTable"></tbody>
      </table>
    </div>

    <div class="section-title" style="margin-top:18px">復習</div>
    <div id="review"></div>

    <div class="grid grid2" style="margin-top:16px">
      <button id="retryWrongBtn" class="btn secondary">今回の誤答だけ再挑戦</button>
      <button id="homeBtn" class="btn primary">設定に戻る</button>
    </div>
  </section>

  <div class="footer">問題・選択肢は知識によって判定できるよう、文体・長さ・断定度をできるだけ均質化しています。</div>
</div>

<script>
const baseBank = [
  {
    category:"暗号・PKI",
    question:"TLS 1.3の暗号スイート TLS_AES_128_GCM_SHA256 が指定する内容として最も適切なものはどれか。",
    choices:[
      "AES-128-GCM、ECDHE鍵交換、ECDSA署名",
      "AES-128-GCM、RSA鍵交換、SHA-256証明書署名",
      "AES-128-GCMとSHA-256。鍵交換方式と署名方式は別に選択される",
      "AES-128-GCMとSHA-256。鍵交換方式は固定され、署名方式だけが別に選択される"
    ],
    answer:2,
    explanation:"TLS 1.3の暗号スイート名は主にAEAD暗号とHKDFで用いるハッシュを表し、鍵交換方式や署名方式は別にネゴシエーションされる。"
  },
  {
    category:"暗号・PKI",
    question:"署名付きJWT（JWS）について最も適切なものはどれか。",
    choices:[
      "ペイロードは署名によって暗号化されるため、第三者から内容を読まれない",
      "ペイロードはBase64URLで表現されることがあり、署名は主に改ざん検知と真正性確認に用いられる",
      "署名鍵を持たない受信者はペイロードを復号できない",
      "署名付きJWTでは有効期限を表現するクレームを含められない"
    ],
    answer:1,
    explanation:"JWSの署名は機密性を与えない。ペイロードは通常読めるため、秘匿が必要ならJWEなどを使う。"
  },
  {
    category:"暗号・PKI",
    question:"HMACに関する説明として最も適切なものはどれか。",
    choices:[
      "公開鍵とハッシュ関数を利用し、送信者の否認防止に用いる",
      "共有秘密鍵とハッシュ関数を利用し、完全性とメッセージ認証に用いる",
      "共有秘密鍵を利用せず、受信者が公開情報だけで検証する",
      "メッセージ本文を暗号化し、機密性と完全性を同時に与える"
    ],
    answer:1,
    explanation:"HMACは共有秘密鍵とハッシュ関数に基づくMACであり、完全性と認証に使えるが、共有鍵方式なので否認防止には適さない。"
  },
  {
    category:"暗号・PKI",
    question:"Diffie-Hellman鍵共有で p=23, g=5, Aの秘密値a=6 とする。Aの公開値 g^a mod p はどれか。",
    choices:["2","8","13","18"],
    answer:1,
    explanation:"5^6 mod 23 = 8。計算では途中で剰余を取り、値を小さく保つとよい。"
  },
  {
    category:"暗号・PKI",
    question:"OCSPの役割として最も適切なものはどれか。",
    choices:[
      "特定の証明書の失効状態をオンラインで問い合わせる",
      "証明書の秘密鍵を定期的に更新する",
      "証明書チェーンを短縮して検証を省略する",
      "証明書のSANをDNSから取得する"
    ],
    answer:0,
    explanation:"OCSPはOnline Certificate Status Protocolで、証明書の失効状態をオンラインで確認する。"
  },
  {
    category:"認証・認可",
    question:"OAuth 2.0 Authorization Code FlowでPKCEを用いる主な目的として最も適切なものはどれか。",
    choices:[
      "IDトークンの署名方式をクライアント側で固定する",
      "認可コードを取得した第三者による不正なトークン交換を困難にする",
      "stateパラメータを不要にしてCSRF対策を一本化する",
      "アクセストークンを暗号化してリソースサーバへ渡す"
    ],
    answer:1,
    explanation:"PKCEはcode_challengeとcode_verifierを対応付け、認可コード横取り攻撃への耐性を高める。"
  },
  {
    category:"認証・認可",
    question:"OpenID ConnectにおけるIDトークンとアクセストークンの関係として最も適切なものはどれか。",
    choices:[
      "IDトークンは認証結果をクライアントへ伝え、アクセストークンはAPIへの認可に用いられる",
      "IDトークンはAPIへの認可に用い、アクセストークンは利用者の本人確認に用いられる",
      "両者は用途が同じで、名称だけが異なる",
      "両者ともリソースサーバが発行し、認可サーバは関与しない"
    ],
    answer:0,
    explanation:"OIDCではIDトークンは認証、アクセストークンは保護リソースへのアクセス認可に用いられる。"
  },
  {
    category:"認証・認可",
    question:"KerberosでTGTを取得した利用者がサービスを利用する際の流れとして最も適切なものはどれか。",
    choices:[
      "TGTを対象サービスへ直接提示し、そのまま認証を完了する",
      "TGTをTGSへ提示してサービスチケットを取得し、そのチケットを対象サービスへ提示する",
      "TGTをCAへ提示して短期証明書を発行してもらう",
      "TGTをDNSへ登録し、対象サービスがTGTを参照する"
    ],
    answer:1,
    explanation:"TGTはサービスチケットを得るためのチケット。対象サービスにはTGSが発行したサービスチケットを提示する。"
  },
  {
    category:"ネットワーク",
    question:"ステートレスFWで、社内PCの動的ポート49152～65535から外部WebサーバのTCP/443へ接続する。戻り通信を必要最小限に許可する条件として最も適切なものはどれか。",
    choices:[
      "送信元ポート443、宛先ポート49152～65535、ACK設定済みTCP",
      "送信元ポート49152～65535、宛先ポート443、ACK設定済みTCP",
      "送信元ポート443、宛先ポート443、SYN設定済みTCP",
      "送信元ポート49152～65535、宛先ポート443、SYN-ACK設定済みTCP"
    ],
    answer:0,
    explanation:"戻り通信はWebサーバ:443からクライアントの動的ポートへ向かう。ステートレスFWではACKフラグなどを条件にすることがある。"
  },
  {
    category:"ネットワーク",
    question:"IPv4ネットワーク 192.168.10.0/27 で、一般的にホストへ割り当て可能なアドレス数はどれか。",
    choices:["14","30","32","62"],
    answer:1,
    explanation:"/27はホスト部5ビットで32個のアドレス。ネットワークアドレスとブロードキャストアドレスを除き30個。"
  },
  {
    category:"ネットワーク",
    question:"OSPFの説明として最も適切なものはどれか。",
    choices:[
      "距離ベクトル型で、主にホップ数を用いて経路を選択する",
      "リンクステート型で、トポロジ情報から最短経路を計算する",
      "AS間向けのパスベクトル型で、AS_PATHを基に経路を選択する",
      "ホスト名をIPアドレスに対応付けて経路を選択する"
    ],
    answer:1,
    explanation:"OSPFはリンクステート型IGP。各ルータがLSDBを構築し、SPFアルゴリズムで最短経路を計算する。"
  },
  {
    category:"ネットワーク",
    question:"IPv6 Neighbor Discoveryの役割として最も適切なものはどれか。",
    choices:[
      "ICMPv6を利用して近隣ノード探索やルータ探索などを行う",
      "TCPポート番号からMACアドレスを取得する",
      "DNSSECの署名検証に必要な公開鍵を配布する",
      "IPv6パケットをIPv4へ暗号化変換する"
    ],
    answer:0,
    explanation:"IPv6 NDはICMPv6を利用し、IPv4のARPに相当する近隣探索に加えてルータ探索なども担う。"
  },
  {
    category:"DNS・メール",
    question:"DNSSECのDSレコードの役割として最も適切なものはどれか。",
    choices:[
      "親ゾーンに置かれ、子ゾーンのDNSKEYに対応する情報を保持して信頼の連鎖を形成する",
      "RRsetに対するデジタル署名そのものを格納する",
      "ゾーンの公開鍵そのものを格納する",
      "権威DNSサーバのIPv6アドレスを格納する"
    ],
    answer:0,
    explanation:"DSはDelegation Signer。親ゾーンに配置され、子ゾーンDNSKEYとの信頼の連鎖を形成する。"
  },
  {
    category:"DNS・メール",
    question:"DNSSECのRRSIGレコードに格納されるものとして最も適切なものはどれか。",
    choices:[
      "DNSSEC検証用の公開鍵",
      "RRsetに対するデジタル署名",
      "親ゾーンが保持する子ゾーン鍵のダイジェスト",
      "権威DNSサーバのアドレス情報"
    ],
    answer:1,
    explanation:"RRSIGはRRsetに対する署名。DNSKEYは公開鍵、DSは親から子への信頼をつなぐ情報。"
  },
  {
    category:"DNS・メール",
    question:"DMARCで、SPFはpassしたがHeader Fromとアラインせず、DKIMはpassしd=がHeader Fromとアラインしている。DMARCの判定として最も適切なものはどれか。",
    choices:[
      "SPFとDKIMの両方がアラインしていないためfail",
      "DKIMがpassしアラインしているためpass",
      "SPFがアラインしていないためfail",
      "SPFとDKIMの結果が異なるためtemperror"
    ],
    answer:1,
    explanation:"DMARCは、アラインしたSPFまたはDKIMの少なくとも一方がpassすればpassとなる。"
  },
  {
    category:"Webセキュリティ",
    question:"SQL文のORDER BY句に利用者指定の列名を反映したい。SQLインジェクション対策として最も適切なものはどれか。",
    choices:[
      "列名もプレースホルダに渡す",
      "列名中のシングルクォートをエスケープする",
      "許可するソート項目を列挙し、固定された列名へ対応付ける",
      "列名をURLエンコードしてから連結する"
    ],
    answer:2,
    explanation:"バインド変数は値に使うのが基本で、識別子や構文要素には使えない。列名は許可リスト方式が適切。"
  },
  {
    category:"Webセキュリティ",
    question:"JavaScript文字列リテラル内に利用者入力を埋め込む場合のXSS対策として最も適切なものはどれか。",
    choices:[
      "HTML本文向けエスケープを適用する",
      "JavaScript文脈に応じたエンコードや安全なJSONシリアライズを用いる",
      "URLパーセントエンコードを適用する",
      "CSS識別子向けエスケープを適用する"
    ],
    answer:1,
    explanation:"XSS対策は出力コンテキスト依存。JavaScript文字列中ではHTML本文向けエスケープだけでは不十分。"
  },
  {
    category:"Webセキュリティ",
    question:"セッション固定攻撃への対策として最も適切なものはどれか。",
    choices:[
      "ログイン成功時に新しいセッションIDを発行し、認証前のIDを無効化する",
      "ログイン画面をHTTPS化する",
      "CookieにSameSite=Laxを設定する",
      "セッションタイムアウトを短くする"
    ],
    answer:0,
    explanation:"セッション固定対策の中心は、認証前後で同じセッションIDを使い続けないこと。"
  },
  {
    category:"Webセキュリティ",
    question:"CORSの説明として最も適切なものはどれか。",

function loadCustom(){
  try { return JSON.parse(localStorage.getItem("scA2CustomBank")||"[]"); }
  catch(e){ return []; }
}
let customBank = loadCustom();
let bank = [...baseBank, ...customBank];

const $ = s => document.querySelector(s);
const start = $("#start"), quiz = $("#quiz"), result = $("#result");
const countSel = $("#count"), modeSel = $("#mode");
const categoryChips = $("#categoryChips");

let session = [];
let idx = 0;
let answers = [];
let immediate = true;

const labels = ["ア","イ","ウ","エ"];

function uniqCategories(){
  return [...new Set(bank.map(q=>q.category))];
}
function renderCategories(){
  categoryChips.innerHTML="";
  uniqCategories().forEach(c=>{
    const lab=document.createElement("label");
    lab.className="chip";
    const cb=document.createElement("input");
    cb.type="checkbox"; cb.checked=true; cb.value=c;
    lab.appendChild(cb); lab.appendChild(document.createTextNode(c));
    categoryChips.appendChild(lab);
  });
  $("#bankCount").textContent=bank.length;
}
renderCategories();

function selectedCategories(){
  return [...categoryChips.querySelectorAll("input:checked")].map(x=>x.value);
}
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}
function prepareQuestion(q){
  const order = shuffle([0,1,2,3]);
  const choices = order.map(i=>q.choices[i]);
  const answer = order.indexOf(q.answer);
  return {...q,choices,answer};
}
function show(el){el.classList.remove("hidden")}
function hide(el){el.classList.add("hidden")}

$("#startBtn").addEventListener("click",()=>{
  const cats=selectedCategories();
  let pool=bank.filter(q=>cats.includes(q.category));
  const n=Math.min(+countSel.value,pool.length);
  if(!n){alert("出題分野を1つ以上選択してください。");return;}
  session=shuffle(pool).slice(0,n).map(prepareQuestion);
  begin();
});

$("#wrongBtn").addEventListener("click",()=>{
  const ids = JSON.parse(localStorage.getItem("scA2WrongQuestions")||"[]");
  let pool = bank.filter(q=>ids.includes(q.question));
  if(!pool.length){alert("復習できる誤答履歴がありません。");return;}
  session=shuffle(pool).map(prepareQuestion);
  begin();
});

function begin(){
  idx=0; answers=[]; immediate=modeSel.value==="immediate";
  hide(start); hide(result); show(quiz);
  renderQuestion();
}
function renderQuestion(){
  const q=session[idx];
  $("#qno").textContent=`問題 ${idx+1} / ${session.length}`;
  $("#cat").textContent=q.category;
  $("#bar").style.width=`${(idx/session.length)*100}%`;
  $("#question").textContent=q.question;
  $("#feedback").className="feedback hidden";
  $("#nextBtn").classList.add("hidden");
  const box=$("#choices"); box.innerHTML="";
  q.choices.forEach((txt,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML=`<span class="label">${labels[i]}</span><span>${escapeHtml(txt)}</span>`;
    b.addEventListener("click",()=>answer(i));
    box.appendChild(b);
  });
}
function answer(sel){
  const q=session[idx];
  const correct=sel===q.answer;
  answers.push({q,sel,correct});
  [...$("#choices").children].forEach((b,i)=>{
    b.disabled=true;
    if(immediate){
      if(i===q.answer)b.classList.add("correct");
      if(i===sel && i!==q.answer)b.classList.add("wrong");
    }
  });
  if(immediate){
    const f=$("#feedback");
    f.className=`feedback ${correct?"good":"bad"}`;
    f.innerHTML=`<div class="feedback-title">${correct?"正解":"不正解"}</div>
      <div>${escapeHtml(q.explanation)}</div>`;
    show(f);
    show($("#nextBtn"));
  }else{
    setTimeout(next,180);
  }
}
$("#nextBtn").addEventListener("click",next);
function next(){
  idx++;
  if(idx>=session.length){finish();return;}
  renderQuestion();
}
function finish(){
  hide(quiz); show(result);
  const correct=answers.filter(a=>a.correct).length;
  const wrong=answers.length-correct;
  const rate=Math.round(correct/answers.length*100);
  $("#score").textContent=`${correct} / ${answers.length}`;
  $("#correctKpi").textContent=correct;
  $("#wrongKpi").textContent=wrong;
  $("#rateKpi").textContent=`${rate}%`;

  const stats={};
  answers.forEach(a=>{
    if(!stats[a.q.category])stats[a.q.category]={ok:0,total:0};
    stats[a.q.category].total++;
    if(a.correct)stats[a.q.category].ok++;
  });
  $("#catTable").innerHTML=Object.entries(stats).map(([c,s])=>
    `<tr><td>${escapeHtml(c)}</td><td>${s.ok}</td><td>${s.total}</td><td>${Math.round(s.ok/s.total*100)}%</td></tr>`
  ).join("");

  const rev=$("#review"); rev.innerHTML="";
  answers.forEach((a,i)=>{
    const d=document.createElement("details");
    d.open=!a.correct;
    const chosen=a.q.choices[a.sel];
    const correctText=a.q.choices[a.q.answer];
    d.innerHTML=`<summary>問${i+1} ${a.correct?"○":"×"}｜${escapeHtml(a.q.category)}</summary>
      <div class="review-item">
        <div><b>問題：</b>${escapeHtml(a.q.question)}</div>
        <div style="margin-top:6px"><b>あなた：</b>${labels[a.sel]} ${escapeHtml(chosen)}</div>
        <div><b>正解：</b>${labels[a.q.answer]} ${escapeHtml(correctText)}</div>
        <div style="margin-top:6px"><b>解説：</b>${escapeHtml(a.q.explanation)}</div>
      </div>`;
    rev.appendChild(d);
  });

  const wrongQuestions=answers.filter(a=>!a.correct).map(a=>a.q.question);
  localStorage.setItem("scA2WrongQuestions",JSON.stringify(wrongQuestions));
  $("#retryWrongBtn").disabled=wrong===0;
}

$("#retryWrongBtn").addEventListener("click",()=>{
  const wrong = answers.filter(a=>!a.correct).map(a=>a.q);
  if(!wrong.length)return;
  session=wrong.map(q=>{
    // choices are already shuffled in q; restore current as base-like then reshuffle
    const original={...q, choices:[...q.choices], answer:q.answer};
    return prepareQuestion(original);
  });
  begin();
});
$("#homeBtn").addEventListener("click",()=>{hide(result);show(start)});
$("#quitBtn").addEventListener("click",()=>{
  if(confirm("クイズを中断して設定画面に戻りますか？")){
    hide(quiz);show(start);
  }
});

$("#importBtn").addEventListener("click",()=>{
  const msg=$("#importMsg");
  try{
    const arr=JSON.parse($("#importBox").value);
    if(!Array.isArray(arr)) throw new Error("配列ではありません");
    for(const q of arr){
      if(typeof q.category!=="string"||typeof q.question!=="string"||
         !Array.isArray(q.choices)||q.choices.length!==4||
         !Number.isInteger(q.answer)||q.answer<0||q.answer>3||
         typeof q.explanation!=="string"){
        throw new Error("形式が一致しない問題があります");
      }
    }
    customBank=[...customBank,...arr];
    localStorage.setItem("scA2CustomBank",JSON.stringify(customBank));
    bank=[...baseBank,...customBank];
    renderCategories();
    msg.textContent=`${arr.length}問を追加しました。`;
    $("#importBox").value="";
  }catch(e){
    msg.textContent=`読み込みエラー：${e.message}`;
  }
});
$("#clearCustomBtn").addEventListener("click",()=>{
  if(confirm("追加した問題をすべて削除しますか？")){
    customBank=[];
    localStorage.removeItem("scA2CustomBank");
    bank=[...baseBank];
    renderCategories();
    $("#importMsg").textContent="追加問題を削除しました。";
  }
});
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script>
</body>
</html>
